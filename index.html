
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHITALA MODS</title>

<style>
:root {
  --bg: #090b10;
  --panel: #121620;
  --panel2: #191e2a;
  --text: #f5f7fc;
  --muted: #929bad;
  --accent: #ff343f;
  --border: #262d3b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button, input {
  font: inherit;
}

button, a {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  height: 76px;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 0 5%;
  background: #0e1118;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}

.menu-btn {
  width: 43px;
  height: 43px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: white;
  font-size: 23px;
  cursor: pointer;
  flex-shrink: 0;
}

.search-wrap {
  flex: 1;
  max-width: 470px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  height: 43px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: white;
  padding: 0 42px 0 15px;
  outline: none;
  appearance: none;
}

.search-wrap input:focus {
  border-color: var(--accent);
}

.search-wrap input::-webkit-search-cancel-button {
  display: none;
  appearance: none;
}

.clear-search {
  position: absolute;
  right: 9px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  font-size: 22px;
  cursor: pointer;
  display: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  cursor: pointer;
  flex-shrink: 0;
}

.brand img {
  width: 43px;
  height: 43px;
  object-fit: contain;
  border-radius: 11px;
}

.brand-name {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 1px;
}

.brand-name span {
  color: var(--accent);
}

.drawer-overlay {
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 29;
  display: none;
}

.drawer {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  width: 270px;
  max-width: 82vw;
  padding: 25px 18px;
  background: #10141d;
  border-right: 1px solid var(--border);
  z-index: 30;
  transform: translateX(-105%);
  transition: transform .25s ease;
}

.drawer.open {
  transform: translateX(0);
}

.drawer-overlay.open {
  display: block;
}

.drawer-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.drawer-title {
  font-size: 19px;
  font-weight: 900;
}

.close-drawer {
  border: 0;
  background: var(--panel2);
  color: white;
  width: 37px;
  height: 37px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 22px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  margin: 7px 0;
  background: transparent;
  color: #cbd2df;
  text-align: left;
  cursor: pointer;
}

.nav-btn:hover,
.nav-btn.active {
  background: #25202a;
  color: white;
}

.nav-btn.active {
  border-left: 3px solid var(--accent);
}

main {
  max-width: 1200px;
  width: 90%;
  margin: 0 auto;
  min-height: 70vh;
  padding: 32px 0 55px;
}

.page {
  display: none;
}

.page.active {
  display: block;
  animation: fadeIn .2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin: 0 0 23px;
}

.section-heading h1,
.section-heading h2 {
  margin: 0;
  font-size: clamp(21px, 4vw, 29px);
  letter-spacing: -.5px;
}

.section-heading h1 span,
.section-heading h2 span {
  color: var(--accent);
}

.heading-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.game-count {
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 8px 11px;
  border-radius: 10px;
}

.view-all {
  color: var(--accent);
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.game-card {
  display: flex;
  align-items: center;
  gap: 15px;
  min-width: 0;
  padding: 15px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 17px;
  transition: border-color .2s, transform .2s, background .2s;
  cursor: pointer;
}

.game-card:hover {
  transform: translateY(-3px);
  border-color: #454e61;
  background: #171c27;
}

.game-logo {
  width: 76px;
  height: 76px;
  object-fit: cover;
  border-radius: 15px;
  flex-shrink: 0;
  background: var(--panel2);
  border: 1px solid #ffffff10;
}

.game-info {
  flex: 1;
  min-width: 0;
}

.game-info h3 {
  margin: 0 0 7px;
  font-size: 15px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.game-info p {
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 10px;
}

.game-open {
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
}

.empty-state {
  padding: 35px 15px;
  color: var(--muted);
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: 15px;
  grid-column: 1 / -1;
}

.detail-card {
  max-width: 800px;
  margin: 0 auto;
  padding: 25px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--panel);
}

.detail-top {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 25px;
}

.detail-logo {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 20px;
  flex-shrink: 0;
}

.detail-top h1 {
  margin: 0 0 9px;
  font-size: clamp(22px, 4vw, 31px);
}

.detail-top p,
.detail-description {
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
}

.detail-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 22px;
}

.action-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 13px 18px;
  background: var(--accent);
  color: white;
  border: 0;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

.action-btn.secondary {
  background: var(--panel2);
  border: 1px solid var(--border);
}

.back-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 20px;
  cursor: pointer;
}

.contact-card {
  max-width: 650px;
  padding: 25px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
}

.social-links {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 20px;
}

.social-link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 15px;
  font-size: 13px;
  font-weight: 700;
}

.social-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 27px;
  height: 27px;
  border-radius: 8px;
  background: var(--accent);
  color: white;
  font-weight: 900;
}

footer {
  border-top: 1px solid var(--border);
  padding: 25px 5%;
  color: var(--muted);
  text-align: center;
  font-size: 12px;
}

footer strong {
  color: white;
}

@media (max-width: 850px) {
  .game-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  main {
    width: 92%;
  }
}

@media (max-width: 560px) {
  header {
    height: 67px;
    padding: 0 4%;
    gap: 9px;
  }

  .menu-btn {
    width: 38px;
    height: 38px;
  }

  .search-wrap input {
    height: 39px;
    padding-left: 10px;
    font-size: 13px;
  }

  .brand {
    gap: 6px;
  }

  .brand img {
    width: 37px;
    height: 37px;
  }

  .brand-name {
    font-size: 11px;
    letter-spacing: 0;
  }

  main {
    padding-top: 25px;
  }

  .game-grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .game-card {
    padding: 12px;
  }

  .game-logo {
    width: 68px;
    height: 68px;
  }

  .section-heading {
    align-items: flex-start;
  }

  .heading-right {
    gap: 7px;
  }

  .game-count {
    padding: 7px 8px;
    font-size: 11px;
  }

  .view-all {
    font-size: 12px;
    padding-top: 8px;
  }

  .detail-card {
    padding: 17px;
  }

  .detail-top {
    gap: 13px;
  }

  .detail-logo {
    width: 83px;
    height: 83px;
    border-radius: 15px;
  }
}
</style>
</head>

<body>

<header>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>

  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="Search games..." autocomplete="off">
    <button class="clear-search" id="clearSearch" aria-label="Clear search">×</button>
  </div>

  <div class="brand" id="brandBtn" role="button" tabindex="0" aria-label="Open home menu">
    <img src="logo.png" alt="Chitala Mods logo">
    <div class="brand-name">CHITALA <span>MODS</span></div>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-top">
    <div class="drawer-title">CHITALA <span style="color:var(--accent)">MODS</span></div>
    <button class="close-drawer" id="closeDrawer" aria-label="Close menu">×</button>
  </div>

  <button class="nav-btn active" data-page="home">⌂ <span>Home</span></button>
  <button class="nav-btn" data-page="games">🎮 <span>Games</span></button>
  <button class="nav-btn" data-page="contact">✉ <span>Contact</span></button>
</aside>

<main>
  <section class="page active" id="home">
    <div class="section-heading">
      <h1>Latest <span>Games</span></h1>
      <div class="heading-right">
        <span class="game-count" id="homeCount">3 Games</span>
        <a href="#" class="view-all" data-goto="games">View All →</a>
      </div>
    </div>

    <div class="game-grid" id="homeGames"></div>

    <div id="recentSection" style="display:none; margin-top:42px">
      <div class="section-heading">
        <h2>Recently <span>Opened</span></h2>
      </div>
      <div class="game-grid" id="recentGames"></div>
    </div>
  </section>

  <section class="page" id="games">
    <div class="section-heading">
      <h1><span>Games</span></h1>
      <span class="game-count" id="gamesCount">3 Games</span>
    </div>
    <div class="game-grid" id="allGames"></div>
  </section>

  <section class="page" id="contact">
    <div class="section-heading">
      <h1>Contact <span>Us</span></h1>
    </div>

    <div class="contact-card">
      <h2>Stay Connected</h2>
      <p class="detail-description">
        Follow CHITALA MODS for game updates, tutorials and more.
      </p>

      <div class="social-links">
        <a class="social-link" href="https://t.me/chitalamod" target="_blank" rel="noopener noreferrer">
          <span class="social-icon">➤</span> Telegram
        </a>
        <a class="social-link" href="https://youtube.com/@chitalaa?si=9U6_I0cpkyXbr5to" target="_blank" rel="noopener noreferrer">
          <span class="social-icon">▶</span> YouTube
        </a>
        <a class="social-link" href="https://facebook.com/" target="_blank" rel="noopener noreferrer">
          <span class="social-icon">f</span> Facebook
        </a>
      </div>
    </div>
  </section>

  <section class="page" id="gameDetails">
    <button class="back-btn" id="backBtn">← Back to Games</button>
    <div id="detailContent"></div>
  </section>
</main>

<footer>
  <strong>CHITALA MODS</strong> · Games, updates and tutorials
</footer>

<script>
const games = [
  {
    id: "shadow",
    title: "Shadow Fight 2",
    version: "MOD APK",
    image: "shadow-fight-2.jpg",
    description: "Discover Shadow Fight 2, explore the gameplay and find the download and tutorial links.",
    download: "https://drive.usercontent.google.com/download?id=1nypebh2xJD1uXJwu2_VKxIGJ6lpCzupK&export=download&authuser=0",
    tutorial: "https://youtu.be/ecuTZ0yzTfg?si=6gsTHwQ99RolmMzb"
  },
  {
    id: "invincible",
    title: "Invincible: Guarding the Globe",
    version: "Version 3.7.11",
    image: "invincible.jpg",
    description: "Explore Invincible: Guarding the Globe and find the game page.",
    download: "https://play.google.com/store/search?q=Invincible%20Guarding%20the%20Globe&c=apps"
  },
  {
    id: "mortal",
    title: "Mortal Kombat",
    version: "Version 7.4.0",
    image: "mortal-kombat.jpg",
    description: "Enter the Mortal Kombat universe and visit the game page.",
    download: "https://play.google.com/store/search?q=Mortal%20Kombat&c=apps"
  }
];

let searchQuery = "";
let currentPage = "home";
let previousPage = "games";
let recentGames = [];

const $ = id => document.getElementById(id);

function filteredGames() {
  const query = searchQuery.trim().toLowerCase();
  return games.filter(game =>
    game.title.toLowerCase().includes(query) ||
    game.version.toLowerCase().includes(query)
  );
}

function cardHTML(game) {
  return `
    <article class="game-card" data-game="${game.id}" tabindex="0" role="button"
      aria-label="Open ${game.title}">
      <img class="game-logo" src="${game.image}" alt="${game.title} logo"
        loading="lazy">
      <div class="game-info">
        <h3>${game.title}</h3>
        <p>${game.version}</p>
        <span class="game-open">View Game →</span>
      </div>
    </article>
  `;
}

function renderGames() {
  const list = filteredGames();

  $("homeCount").textContent = `${games.length} Games`;
  $("gamesCount").textContent = `${list.length} Games`;

  $("homeGames").innerHTML = list.length
    ? list.slice(0, 3).map(cardHTML).join("")
    : `<div class="empty-state">No games found.</div>`;

  $("allGames").innerHTML = list.length
    ? list.map(cardHTML).join("")
    : `<div class="empty-state">No games found. Try another search.</div>`;

  renderRecent();
}

function renderRecent() {
  const section = $("recentSection");
  const container = $("recentGames");

  if (!recentGames.length) {
    section.style.display = "none";
    return;
  }

  section.style.display = "block";
  container.innerHTML = recentGames
    .map(id => games.find(game => game.id === id))
    .filter(Boolean)
    .map(cardHTML)
    .join("");
}

function showPage(page) {
  if (!$(page)) return;

  document.querySelectorAll(".page").forEach(section => {
    section.classList.toggle("active", section.id === page);
  });

  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });

  currentPage = page;
  closeMenu();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openGame(id) {
  const game = games.find(item => item.id === id);
  if (!game) return;

  previousPage = currentPage === "gameDetails" ? previousPage : currentPage;

  recentGames = [id, ...recentGames.filter(item => item !== id)].slice(0, 3);

  $("detailContent").innerHTML = `
    <div class="detail-card">
      <div class="detail-top">
        <img class="detail-logo" src="${game.image}" alt="${game.title} logo">
        <div>
          <h1>${game.title}</h1>
          <p>${game.version}</p>
        </div>
      </div>

      <p class="detail-description">${game.description}</p>

      <div class="detail-actions">
        <a class="action-btn" href="${game.download}"
          target="_blank" rel="noopener noreferrer">
          ${game.id === "shadow" ? "Download Game ↓" : "Open Game Page ↗"}
        </a>

        ${game.tutorial ? `
          <a class="action-btn secondary" href="${game.tutorial}"
            target="_blank" rel="noopener noreferrer">
            Watch Tutorial ▶
          </a>` : ""}
      </div>
    </div>
  `;

  showPage("gameDetails");
  renderRecent();
}

function openMenu() {
  $("drawer").classList.add("open");
  $("drawerOverlay").classList.add("open");
}

function closeMenu() {
  $("drawer").classList.remove("open");
  $("drawerOverlay").classList.remove("open");
}

$("menuBtn").addEventListener("click", openMenu);
$("closeDrawer").addEventListener("click", closeMenu);
$("drawerOverlay").addEventListener("click", closeMenu);

$("brandBtn").addEventListener("click", openMenu);
$("brandBtn").addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openMenu();
  }
});

document.querySelectorAll(".nav-btn").forEach(button => {
  button.addEventListener("click", () => {
    showPage(button.dataset.page);
  });
});

document.querySelectorAll("[data-goto]").forEach(link => {
  link.addEventListener("click", event => {
    event.preventDefault();
    showPage(link.dataset.goto);
  });
});

document.addEventListener("click", event => {
  const card = event.target.closest("[data-game]");
  if (card) openGame(card.dataset.game);
});

document.addEventListener("keydown", event => {
  const card = event.target.closest("[data-game]");
  if (card && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    openGame(card.dataset.game);
  }

  if (event.key === "Escape") closeMenu();
});

$("backBtn").addEventListener("click", () => {
  showPage(previousPage === "gameDetails" ? "games" : previousPage);
});

$("searchInput").addEventListener("input", event => {
  searchQuery = event.target.value;
  $("clearSearch").style.display = searchQuery ? "block" : "none";

  renderGames();

  if (searchQuery.trim() && currentPage === "home") {
    showPage("games");
  }
});

$("clearSearch").addEventListener("click", () => {
  $("searchInput").value = "";
  searchQuery = "";
  $("clearSearch").style.display = "none";
  renderGames();
  $("searchInput").focus();
});

renderGames();
</script>
</body>
</html>
