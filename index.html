
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c12">
<title>CHITALA MODS</title>

<style>
:root {
  --bg: #090b11;
  --surface: #11151f;
  --surface2: #171c28;
  --border: #252c3a;
  --text: #f5f6fb;
  --muted: #929bad;
  --red: #ff3948;
  --radius: 16px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, Arial, Helvetica, sans-serif;
}

button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; }

header {
  height: 76px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  gap: 15px;
  background: #0c0f16;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}

.menu-btn {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: white;
  font-size: 21px;
  flex-shrink: 0;
}

.search-wrap {
  flex: 1;
  max-width: 450px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  height: 42px;
  padding: 0 40px 0 14px;
  border-radius: 12px;
  outline: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: white;
}

.search-wrap input:focus { border-color: #535d72; }

.search-wrap input::-webkit-search-cancel-button {
  appearance: none;
  display: none;
}

.clear-search {
  display: none;
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 22px;
}

.brand {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  flex-shrink: 0;
}

.brand img {
  width: 43px;
  height: 43px;
  object-fit: contain;
  border-radius: 12px;
}

.brand-name {
  font-size: 16px;
  font-weight: 900;
  letter-spacing: .8px;
}

.brand-name span { color: var(--red); }

.drawer-overlay {
  position: fixed;
  inset: 0;
  background: #000a;
  z-index: 29;
  display: none;
}

.drawer-overlay.open { display: block; }

.drawer {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  width: 275px;
  max-width: 85vw;
  padding: 24px 18px;
  background: #10141e;
  border-right: 1px solid var(--border);
  transform: translateX(-105%);
  transition: transform .25s ease;
}

.drawer.open { transform: translateX(0); }

.drawer-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 30px;
}

.drawer-title { font-weight: 900; font-size: 18px; }
.drawer-title span { color: var(--red); }

.close-drawer {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface2);
  color: white;
  font-size: 22px;
}

.nav-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 7px 0;
  padding: 14px;
  text-align: left;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: #c6ccda;
}

.nav-btn:hover,
.nav-btn.active {
  color: white;
  background: #1d2230;
  border-color: var(--border);
}

.nav-btn.active { box-shadow: inset 3px 0 var(--red); }

main {
  width: 90%;
  max-width: 1240px;
  min-height: 72vh;
  margin: 0 auto;
  padding: 36px 0 65px;
}

.page { display: none; }
.page.active { display: block; }

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 24px;
}

.section-heading h1,
.section-heading h2 {
  margin: 0;
  font-size: clamp(22px, 3vw, 29px);
  font-weight: 850;
  letter-spacing: -.6px;
}

.section-heading h1 span,
.section-heading h2 span { color: var(--red); }

.heading-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.count {
  white-space: nowrap;
  color: var(--muted);
  font-size: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 8px 11px;
}

.view-all {
  color: #d7dbe5;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  transition: color .2s;
}

.view-all:hover { color: var(--red); }

/* Home: compact square game tiles */

.game-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 17px;
}

.game-tile {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  transition: transform .2s, border-color .2s, background .2s;
}

.game-tile:hover {
  transform: translateY(-4px);
  border-color: #515b70;
  background: var(--surface2);
}

.tile-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: block;
  object-fit: cover;
  background: var(--surface2);
}

.tile-name {
  min-height: 56px;
  padding: 13px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 14px;
  line-height: 1.4;
  font-weight: 750;
  overflow-wrap: anywhere;
}

/* Games page: tiles with more information */

.game-info {
  padding: 13px;
}

.game-info h3 {
  margin: 0 0 9px;
  font-size: 14px;
  line-height: 1.4;
}

.game-info p {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.game-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.mod-badge {
  padding: 5px 8px;
  border-radius: 7px;
  color: #ff7881;
  background: #ff394815;
  border: 1px solid #ff394830;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .5px;
}

.version {
  color: var(--muted);
  font-size: 11px;
}

.open-label {
  margin-top: 13px;
  padding-top: 11px;
  border-top: 1px solid var(--border);
  color: #d9deea;
  font-size: 12px;
  font-weight: 700;
}

.empty-state {
  grid-column: 1 / -1;
  padding: 35px 15px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

/* Game detail page */

.back-btn {
  margin-bottom: 22px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: #d8dce7;
  background: var(--surface);
  font-size: 13px;
}

.back-btn:hover { border-color: #626c80; }

.detail-wrap {
  overflow: hidden;
  max-width: 950px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 21px;
}

.detail-banner {
  position: relative;
  min-height: 240px;
  display: flex;
  align-items: flex-end;
  padding: 28px;
  overflow: hidden;
  background: #171b26;
}

.detail-banner-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(2px) brightness(.45);
  transform: scale(1.04);
}

.detail-banner::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, #090b11 0%, #090b1150 70%, #090b1130 100%);
}

.detail-heading {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-end;
  gap: 19px;
}

.detail-logo {
  width: 112px;
  height: 112px;
  flex-shrink: 0;
  object-fit: cover;
  border: 3px solid #ffffff25;
  border-radius: 19px;
  box-shadow: 0 8px 30px #0007;
}

.detail-title h1 {
  margin: 0 0 10px;
  font-size: clamp(23px, 4vw, 35px);
  line-height: 1.15;
}

.detail-title p {
  margin: 0;
  color: #d3d7e2;
  font-size: 13px;
}

.detail-body { padding: 25px 28px 30px; }

.detail-label {
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.3px;
  font-size: 10px;
  font-weight: 800;
}

.detail-description {
  margin: 12px 0 22px;
  max-width: 700px;
  color: #c0c6d4;
  font-size: 14px;
  line-height: 1.8;
}

.detail-features {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 24px;
}

.feature {
  padding: 8px 11px;
  border: 1px solid var(--border);
  background: #171c27;
  color: #d5dae5;
  border-radius: 9px;
  font-size: 11px;
}

.detail-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 11px;
}

.action-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 43px;
  padding: 12px 17px;
  border: 1px solid var(--red);
  border-radius: 11px;
  background: var(--red);
  color: white;
  font-size: 13px;
  font-weight: 800;
  transition: opacity .2s, transform .2s;
}

.action-btn:hover {
  opacity: .88;
  transform: translateY(-1px);
}

.action-btn.secondary {
  background: var(--surface2);
  border-color: var(--border);
  color: #e2e6ef;
}

/* Contact and footer */

.contact-card {
  max-width: 650px;
  padding: 25px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
}

.contact-card h2 { margin-top: 0; }

.contact-card p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.social-links {
  display: flex;
  flex-wrap: wrap;
  gap: 11px;
  margin-top: 20px;
}

.social-link {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 11px 13px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--surface2);
  font-size: 13px;
  font-weight: 700;
}

.social-icon {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--red);
  color: white;
  font-weight: 900;
}

footer {
  padding: 24px 5%;
  border-top: 1px solid var(--border);
  color: var(--muted);
  text-align: center;
  font-size: 12px;
}

footer strong { color: white; }

@media (min-width: 1100px) {
  .game-grid { gap: 20px; }
}

@media (max-width: 900px) {
  .game-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  main { width: 92%; }
}

@media (max-width: 600px) {
  header {
    height: 66px;
    padding: 0 3%;
    gap: 8px;
  }

  .menu-btn {
    width: 36px;
    height: 38px;
    font-size: 19px;
  }

  .search-wrap input {
    height: 38px;
    padding-left: 10px;
    font-size: 12px;
  }

  .brand { gap: 6px; }
  .brand img { width: 35px; height: 35px; }
  .brand-name { font-size: 10px; letter-spacing: 0; }

  main { padding-top: 27px; }

  .game-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .tile-name {
    min-height: 52px;
    padding: 10px 7px;
    font-size: 12px;
  }

  .game-info { padding: 10px; }
  .game-info h3 { font-size: 12px; }
  .game-info p { font-size: 11px; }

  .section-heading { gap: 8px; }
  .section-heading h1,
  .section-heading h2 { font-size: 22px; }
  .heading-actions { gap: 8px; }
  .count { padding: 7px 8px; font-size: 10px; }
  .view-all { font-size: 11px; }

  .detail-banner { min-height: 210px; padding: 18px; }
  .detail-heading { gap: 13px; }
  .detail-logo { width: 83px; height: 83px; border-radius: 14px; }
  .detail-body { padding: 21px 17px 23px; }
  .detail-title h1 { font-size: 23px; }
  .detail-title p { font-size: 12px; }
}

@media (max-width: 370px) {
  .brand-name { display: none; }
  .section-heading h1,
  .section-heading h2 { font-size: 20px; }
  .view-all { font-size: 10px; }
}
</style>
</head>

<body>

<header>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>

  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="Search games..." autocomplete="off">
    <button class="clear-search" id="clearSearch" aria-label="Clear search">×</button>
  </div>

  <div class="brand" id="brandBtn" role="button" tabindex="0" aria-label="Open navigation">
    <img src="logo.png" alt="CHITALA MODS">
    <div class="brand-name">CHITALA <span>MODS</span></div>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-top">
    <div class="drawer-title">CHITALA <span>MODS</span></div>
    <button class="close-drawer" id="closeDrawer" aria-label="Close menu">×</button>
  </div>

  <button class="nav-btn active" data-page="home">⌂ <span>Home</span></button>
  <button class="nav-btn" data-page="games">🎮 <span>Games</span></button>
  <button class="nav-btn" data-page="contact">✉ <span>Contact</span></button>
</aside>

<main>
  <section class="page active" id="home">
    <div class="section-heading">
      <h1>Latest <span>Games</span></h1>
      <div class="heading-actions">
        <span class="count" id="homeCount">3 Games</span>
        <a href="#games" class="view-all" data-goto="games">View all</a>
      </div>
    </div>

    <div class="game-grid" id="homeGames"></div>

    <section id="recentSection" style="display:none; margin-top:42px">
      <div class="section-heading">
        <h2>Recently <span>Opened</span></h2>
      </div>
      <div class="game-grid" id="recentGames"></div>
    </section>
  </section>

  <section class="page" id="games">
    <div class="section-heading">
      <h1>All <span>Games</span></h1>
      <span class="count" id="gamesCount">3 Games</span>
    </div>
    <div class="game-grid" id="allGames"></div>
  </section>

  <section class="page" id="gameDetails">
    <button class="back-btn" id="backBtn">← Back to Games</button>
    <div id="detailContent"></div>
  </section>

  <section class="page" id="contact">
    <div class="section-heading">
      <h1>Contact <span>Us</span></h1>
    </div>

    <div class="contact-card">
      <h2>Stay Connected</h2>
      <p>Follow CHITALA MODS for game updates, tutorials and more.</p>

      <div class="social-links">
        <a class="social-link" href="https://t.me/chitalamod" target="_blank" rel="noopener noreferrer">
          <span class="social-icon">➤</span> Telegram
        </a>
        <a class="social-link" href="https://youtube.com/@chitalaa?si=9U6_I0cpkyXbr5to" target="_blank" rel="noopener noreferrer">
          <span class="social-icon">▶</span> YouTube
        </a>
        <a class="social-link" href="https://facebook.com/" target="_blank" rel="noopener noreferrer">
          <span class="social-icon">f</span> Facebook
        </a>
      </div>
    </div>
  </section>
</main>

<footer>
  <strong>CHITALA MODS</strong> · Gaming • Mods • Tutorials
</footer>

<script>
const games = [
  {
    id: "shadow",
    title: "Shadow Fight 2",
    image: "shadow-fight-2.jpg",
    version: "MOD APK",
    badge: "MOD APK",
    description: "Explore Shadow Fight 2 gameplay, check the available download and watch the tutorial.",
    features: ["Android", "MOD APK", "Gameplay"],
    download: "https://drive.usercontent.google.com/download?id=1nypebh2xJD1uXJwu2_VKxIGJ6lpCzupK&export=download&authuser=0",
    tutorial: "https://youtu.be/ecuTZ0yzTfg?si=6gsTHwQ99RolmMzb"
  },
  {
    id: "invincible",
    title: "Invincible: Guarding the Globe",
    image: "invincible.jpg",
    version: "Game",
    badge: "GAME",
    description: "Enter the Invincible universe and discover the heroes in this mobile game.",
    features: ["Android", "Strategy", "Heroes"],
    download: "https://play.google.com/store/search?q=Invincible%20Guarding%20the%20Globe&c=apps"
  },
  {
    id: "mortal",
    title: "Mortal Kombat",
    image: "mortal-kombat.jpg",
    version: "Game",
    badge: "GAME",
    description: "Explore Mortal Kombat and find the mobile game through the store link.",
    features: ["Android", "Fighting", "Action"],
    download: "https://play.google.com/store/search?q=Mortal%20Kombat&c=apps"
  }
];

let searchQuery = "";
let currentPage = "home";
let previousPage = "home";
let recentGames = [];

const $ = id => document.getElementById(id);

function getFilteredGames() {
  const query = searchQuery.trim().toLowerCase();

  return games.filter(game =>
    game.title.toLowerCase().includes(query) ||
    game.version.toLowerCase().includes(query) ||
    game.badge.toLowerCase().includes(query)
  );
}

/* Compact home tiles: logo and name only */
function homeCard(game) {
  return `
    <article class="game-tile" data-game="${game.id}" tabindex="0" role="button"
      aria-label="Open ${game.title}">
      <img class="tile-image" src="${game.image}" alt="${game.title}" loading="lazy">
      <div class="tile-name">${game.title}</div>
    </article>
  `;
}

/* Games page tiles: logo, name, type and short details */
function gamesCard(game) {
  return `
    <article class="game-tile" data-game="${game.id}" tabindex="0" role="button"
      aria-label="View ${game.title}">
      <img class="tile-image" src="${game.image}" alt="${game.title}" loading="lazy">
      <div class="game-info">
        <h3>${game.title}</h3>
        <p>${game.description}</p>
        <div class="game-meta">
          <span class="mod-badge">${game.badge}</span>
          <span class="version">${game.version}</span>
        </div>
        <div class="open-label">View details</div>
      </div>
    </article>
  `;
}

function renderRecent() {
  const section = $("recentSection");

  if (!recentGames.length) {
    section.style.display = "none";
    $("recentGames").innerHTML = "";
    return;
  }

  section.style.display = "block";
  $("recentGames").innerHTML = recentGames
    .map(id => games.find(game => game.id === id))
    .filter(Boolean)
    .map(homeCard)
    .join("");
}

function renderGames() {
  const filtered = getFilteredGames();

  $("homeCount").textContent = `${games.length} games`;
  $("gamesCount").textContent = `${filtered.length} games`;

  $("homeGames").innerHTML = filtered.length
    ? filtered.slice(0, 4).map(homeCard).join("")
    : `<div class="empty-state">No games found.</div>`;

  $("allGames").innerHTML = filtered.length
    ? filtered.map(gamesCard).join("")
    : `<div class="empty-state">No games found. Try another search.</div>`;

  renderRecent();
}

function showPage(page) {
  if (!$ (page)) return;

  document.querySelectorAll(".page").forEach(section => {
    section.classList.toggle("active", section.id === page);
  });

  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });

  currentPage = page;
  closeMenu();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openGame(id) {
  const game = games.find(item => item.id === id);
  if (!game) return;

  if (currentPage !== "gameDetails") previousPage = currentPage;

  recentGames = [id, ...recentGames.filter(item => item !== id)].slice(0, 4);

  const featureHTML = game.features
    .map(feature => `<span class="feature">${feature}</span>`)
    .join("");

  $("detailContent").innerHTML = `
    <article class="detail-wrap">
      <div class="detail-banner">
        <img class="detail-banner-bg" src="${game.image}" alt="" aria-hidden="true">
        <div class="detail-heading">
          <img class="detail-logo" src="${game.image}" alt="${game.title} logo">
          <div class="detail-title">
            <h1>${game.title}</h1>
            <p>${game.version}</p>
          </div>
        </div>
      </div>

      <div class="detail-body">
        <div class="detail-label">About this game</div>
        <p class="detail-description">${game.description}</p>

        <div class="detail-features">${featureHTML}</div>

        <div class="detail-actions">
          <a class="action-btn" href="${game.download}"
            target="_blank" rel="noopener noreferrer">
            ${game.id === "shadow" ? "Download APK" : "Open Game Page"}
          </a>

          ${game.tutorial ? `
            <a class="action-btn secondary" href="${game.tutorial}"
              target="_blank" rel="noopener noreferrer">
              Watch Tutorial
            </a>` : ""}
        </div>
      </div>
    </article>
  `;

  showPage("gameDetails");
  renderRecent();
}

function openMenu() {
  $("drawer").classList.add("open");
  $("drawerOverlay").classList.add("open");
}

function closeMenu() {
  $("drawer").classList.remove("open");
  $("drawerOverlay").classList.remove("open");
}

$("menuBtn").addEventListener("click", openMenu);
$("closeDrawer").addEventListener("click", closeMenu);
$("drawerOverlay").addEventListener("click", closeMenu);

$("brandBtn").addEventListener("click", openMenu);
$("brandBtn").addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openMenu();
  }
});

document.querySelectorAll(".nav-btn").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

document.querySelectorAll("[data-goto]").forEach(link => {
  link.addEventListener("click", event => {
    event.preventDefault();
    showPage(link.dataset.goto);
  });
});

document.addEventListener("click", event => {
  const card = event.target.closest("[data-game]");
  if (card) openGame(card.dataset.game);
});

document.addEventListener("keydown", event => {
  const card = event.target.closest("[data-game]");

  if (card && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    openGame(card.dataset.game);
  }

  if (event.key === "Escape") closeMenu();
});

$("backBtn").addEventListener("click", () => {
  showPage(previousPage === "gameDetails" ? "games" : previousPage);
});

$("searchInput").addEventListener("input", event => {
  searchQuery = event.target.value;
  $("clearSearch").style.display = searchQuery ? "block" : "none";

  renderGames();

  if (searchQuery.trim() && currentPage === "home") {
    showPage("games");
  }
});

$("clearSearch").addEventListener("click", () => {
  $("searchInput").value = "";
  searchQuery = "";
  $("clearSearch").style.display = "none";
  renderGames();
  $("searchInput").focus();
});

renderGames();
</script>

</body>
</html>
