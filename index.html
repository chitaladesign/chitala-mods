<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090c">
<title>CHITALA PROD — ონლაინ თამაშები</title>

<style>
:root{--bg:#09090c;--panel:#141419;--border:#2a2a33;--red:#ed2337;--text:#f5f5f7;--muted:#9999a7}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#351017,transparent 55%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.container{width:min(1120px,calc(100% - 32px));margin:auto}
header{height:72px;position:sticky;top:0;z-index:10;background:rgba(9,9,12,.94);backdrop-filter:blur(14px);border-bottom:1px solid #25252c}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:40px;height:40px;flex-shrink:0}
.brand-name{font-size:18px;font-weight:900;letter-spacing:1px;white-space:nowrap}
.brand-name span,.accent{color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:#35ff83;box-shadow:0 0 9px #35ff83,0 0 17px #16c95d;flex-shrink:0}
.nav-links{display:flex;gap:24px;color:#c4c4cc;font-size:13px}
.nav-links a:hover{color:white}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid transparent;border-radius:9px;padding:11px 15px;font-size:13px;font-weight:800;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.primary{background:linear-gradient(135deg,#f12d43,#b91127);color:white}
.secondary{background:#19191f;border-color:#35353e;color:white}
.hero{text-align:center;padding:76px 0 52px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid #49212a;background:#95162920;border-radius:30px;padding:8px 12px;font-size:11px;letter-spacing:1.5px;font-weight:900;color:#f0b6bf;margin-bottom:20px}
h1{font-size:clamp(32px,5.5vw,58px);line-height:1.15;letter-spacing:-1px;margin:0 auto;max-width:800px;font-weight:900}
